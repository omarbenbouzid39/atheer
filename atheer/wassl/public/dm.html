<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>وصل — الرسائل المباشرة</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/style.css">
<style>
.dm-layout{display:grid;grid-template-columns:320px 1fr;height:100vh;overflow:hidden;padding-top:0}
.dm-sidebar{border-left:1px solid var(--border-color);display:flex;flex-direction:column;overflow:hidden;background:var(--surface-color)}
.dm-sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between}
.dm-sidebar-title{font-size:16px;font-weight:700}
.dm-search{padding:10px 16px;border-bottom:1px solid var(--border-color)}
.dm-search-input{width:100%;background:var(--input-bg);border:1px solid var(--border-color);color:var(--text-color);font-size:13px;padding:8px 14px;border-radius:20px;outline:none;font-family:inherit}
.dm-search-input:focus{border-color:rgba(59,130,246,.5)}
.dm-list{flex:1;overflow-y:auto;scrollbar-width:thin}
.dm-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--border-color)}
.dm-item:hover,.dm-item.active{background:rgba(59,130,246,.07)}
.dm-item.active{border-right:3px solid #3b82f6}
.dm-ava{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:white;flex-shrink:0;position:relative}
.dm-ava-online{position:absolute;bottom:2px;right:2px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--surface-color)}
.dm-info{flex:1;min-width:0}
.dm-name{font-size:14px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-last{font-size:12px;color:var(--muted-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.dm-time{font-size:11px;color:var(--muted-color)}
.dm-unread{background:#3b82f6;color:white;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.dm-main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg-color)}
.dm-header{padding:12px 20px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:12px;background:var(--surface-color)}
.dm-header-ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:white;flex-shrink:0}
.dm-header-name{font-size:15px;font-weight:700}
.dm-header-sub{font-size:12px;color:var(--muted-color)}
.dm-header-actions{margin-right:auto;display:flex;gap:8px}
.dm-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.dm-msg{display:flex;flex-direction:column;max-width:72%}
.dm-msg.mine{align-self:flex-end;align-items:flex-end}
.dm-msg.theirs{align-self:flex-start;align-items:flex-start}
.dm-bubble{padding:10px 16px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
.dm-msg.mine .dm-bubble{background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;border-bottom-right-radius:4px}
.dm-msg.theirs .dm-bubble{background:var(--surface-color);border:1px solid var(--border-color);border-bottom-left-radius:4px}
.dm-msg-time{font-size:10px;color:var(--muted-color);margin-top:3px;padding:0 4px}
.dm-input-row{padding:12px 16px;border-top:1px solid var(--border-color);display:flex;gap:10px;align-items:center;background:var(--surface-color)}
.dm-input{flex:1;background:var(--input-bg);border:1px solid var(--border-color);color:var(--text-color);font-size:14px;padding:10px 16px;border-radius:24px;outline:none;font-family:inherit;transition:border-color .2s;resize:none;max-height:120px}
.dm-input:focus{border-color:rgba(59,130,246,.5)}
.dm-send{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s}
.dm-send:hover{opacity:.85}
.dm-send svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.dm-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted-color);text-align:center;padding:40px}
.dm-empty-icon{font-size:64px;margin-bottom:16px;opacity:.4}
.dm-empty-title{font-size:18px;font-weight:700;color:var(--text-color);margin-bottom:8px}
.dm-typing{font-size:12px;color:var(--muted-color);padding:4px 16px;min-height:20px}
.verified-badge{color:#3b82f6;font-size:14px}
.baseer-link{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:rgba(200,245,100,.7);background:rgba(200,245,100,.08);border:1px solid rgba(200,245,100,.2);border-radius:20px;padding:2px 8px;text-decoration:none;transition:opacity .2s;white-space:nowrap}
.baseer-link:hover{opacity:.8}
@media(max-width:700px){
  .dm-layout{grid-template-columns:1fr}
  .dm-sidebar{display:none}
  .dm-sidebar.mobile-show{display:flex;position:fixed;inset:0;z-index:50}
  .mobile-back{display:flex!important}
}
.mobile-back{display:none;align-items:center;gap:8px;background:none;border:none;color:var(--text-color);cursor:pointer;font-size:14px;font-family:inherit}
</style>
</head>
<body class="dark-mode">

<div class="dm-layout" id="dmLayout">
  <!-- Sidebar -->
  <div class="dm-sidebar" id="dmSidebar">
    <div class="dm-sidebar-header">
      <div class="dm-sidebar-title">💬 الرسائل المباشرة</div>
      <a href="/index.html" style="font-size:12px;color:var(--muted-color);text-decoration:none">← العودة</a>
    </div>
    <div class="dm-search">
      <input class="dm-search-input" id="userSearchInput" placeholder="ابحث عن مستخدم..." oninput="searchUsers()">
    </div>
    <div class="dm-list" id="dmList">
      <div style="padding:20px;text-align:center;color:var(--muted-color);font-size:13px">جاري التحميل...</div>
    </div>
  </div>

  <!-- Main -->
  <div class="dm-main" id="dmMain">
    <div class="dm-empty" id="dmEmpty">
      <div class="dm-empty-icon">💬</div>
      <div class="dm-empty-title">اختر محادثة</div>
      <div>اختر مستخدماً من القائمة أو ابحث عن صديق للبدء</div>
    </div>

    <!-- Chat Area (hidden initially) -->
    <div id="dmChatArea" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div class="dm-header">
        <button class="mobile-back" onclick="showSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          رجوع
        </button>
        <div class="dm-header-ava" id="chatHeaderAva">أ</div>
        <div>
          <div class="dm-header-name" id="chatHeaderName">—</div>
          <div class="dm-header-sub" id="chatHeaderSub">وصل</div>
        </div>
        <div class="dm-header-actions" id="chatHeaderActions"></div>
      </div>
      <div class="dm-messages" id="dmMessages"></div>
      <div class="dm-typing" id="dmTypingIndicator"></div>
      <div class="dm-input-row">
        <textarea class="dm-input" id="dmInput" placeholder="اكتب رسالة..." rows="1"
          oninput="autoResize(this);onTyping()"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendDM()}"></textarea>
        <button class="dm-send" onclick="sendDM()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API_BASE   = '';
let myUsername   = '', myToken = '', activeWith = null;
let socket       = null, typingTimer = null, searchTimer = null;
const onlineSet  = new Set();

// ── Init ──
window.addEventListener('load', async () => {
  myToken    = localStorage.getItem('wasl_token');
  myUsername = localStorage.getItem('wasl_username');
  if (!myToken || !myUsername) { window.location.href = '/index.html'; return; }

  // Dark mode
  const theme = localStorage.getItem('wasl_theme') || 'dark';
  document.body.className = theme === 'dark' ? 'dark-mode' : 'light-mode';

  await loadConversations();
  connectSocket();

  // Check for ?with= param (من بصير أو profile)
  const params = new URLSearchParams(location.search);
  const withUser = params.get('with');
  if (withUser) openChat(withUser);
});

function connectSocket() {
  socket = io({ auth: { token: myToken } });
  socket.on('connect', () => {
    socket.emit('app_join', { token: myToken });
  });
  socket.on('dm_message', msg => {
    if (msg.from === activeWith || msg.to === activeWith) {
      appendMessage(msg);
      scrollToBottom();
    }
    loadConversations(); // تحديث القائمة
  });
  socket.on('dm_typing', ({ from, isTyping }) => {
    if (from === activeWith) {
      document.getElementById('dmTypingIndicator').textContent = isTyping ? `${from} يكتب...` : '';
    }
  });
}

// ── Load Conversations ──
async function loadConversations() {
  try {
    const res = await apiGet('/api/dm/conversations');
    const list = document.getElementById('dmList');
    if (!res.length) {
      list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted-color);font-size:13px">لا توجد محادثات بعد<br><small>ابحث عن مستخدم أعلاه</small></div>';
      return;
    }
    list.innerHTML = res.map(conv => `
      <div class="dm-item${conv.with === activeWith ? ' active' : ''}" onclick="openChat('${esc(conv.with)}')">
        <div class="dm-ava">
          ${esc((conv.with||'م')[0]).toUpperCase()}
          ${onlineSet.has(conv.with) ? '<div class="dm-ava-online"></div>' : ''}
        </div>
        <div class="dm-info">
          <div class="dm-name">${esc(conv.with)}</div>
          <div class="dm-last">${esc(conv.lastMessage || '—')}</div>
        </div>
        <div class="dm-meta">
          <div class="dm-time">${timeAgo(conv.lastAt)}</div>
          ${conv.unread > 0 ? `<div class="dm-unread">${conv.unread}</div>` : ''}
        </div>
      </div>`).join('');
  } catch(e) { console.error(e); }
}

// ── Search Users ──
async function searchUsers() {
  const q = document.getElementById('userSearchInput').value.trim();
  clearTimeout(searchTimer);
  if (q.length < 2) { loadConversations(); return; }
  searchTimer = setTimeout(async () => {
    try {
      const users = await apiGet(`/api/users/search?q=${encodeURIComponent(q)}`);
      const list  = document.getElementById('dmList');
      if (!users.length) { list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted-color);font-size:13px">لا نتائج</div>'; return; }
      list.innerHTML = users.map(u => `
        <div class="dm-item" onclick="openChat('${esc(u.username)}')">
          <div class="dm-ava">${esc((u.username||'م')[0]).toUpperCase()}</div>
          <div class="dm-info">
            <div class="dm-name">
              ${esc(u.username)}
              ${u.verified ? '<span class="verified-badge">✓</span>' : ''}
            </div>
            <div class="dm-last">${esc(u.bio || 'مستخدم وصل')}</div>
          </div>
          ${u.baseer_handle ? `<a href="https://baseer.onrender.com/profile.html?handle=${encodeURIComponent(u.baseer_handle)}" target="_blank" class="baseer-link" onclick="event.stopPropagation()">🎬 بصير</a>` : ''}
        </div>`).join('');
    } catch(e) {}
  }, 400);
}

// ── Open Chat ──
async function openChat(username) {
  if (!username || username === myUsername) return;
  activeWith = username;

  document.getElementById('dmEmpty').style.display = 'none';
  const chatArea = document.getElementById('dmChatArea');
  chatArea.style.display = 'flex';

  // Header
  document.getElementById('chatHeaderAva').textContent = username[0].toUpperCase();
  document.getElementById('chatHeaderName').textContent = username;

  // Baseer link?
  try {
    const profile = await apiGet(`/api/profile/${username}`);
    let sub = 'وصل';
    let actions = '';
    if (profile.baseer_handle) {
      sub = `${profile.baseer_handle} · وصل`;
      actions = `<a href="https://baseer.onrender.com/profile.html?handle=${encodeURIComponent(profile.baseer_handle)}" target="_blank" class="baseer-link">🎬 شاهد على بصير</a>`;
    }
    document.getElementById('chatHeaderSub').textContent = sub;
    document.getElementById('chatHeaderActions').innerHTML = actions;
  } catch(e) {}

  // Load messages
  document.getElementById('dmMessages').innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted-color);font-size:13px">جاري التحميل...</div>';
  try {
    const msgs = await apiGet(`/api/dm/${username}`);
    renderMessages(msgs);
  } catch(e) {
    document.getElementById('dmMessages').innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted-color)">فشل التحميل</div>';
  }

  // Update sidebar active state
  loadConversations();
  document.getElementById('dmInput').focus();
  scrollToBottom();
}

// ── Render Messages ──
function renderMessages(msgs) {
  const el = document.getElementById('dmMessages');
  if (!msgs.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted-color);font-size:13px">لا توجد رسائل — ابدأ المحادثة!</div>';
    return;
  }
  el.innerHTML = msgs.map(m => buildBubble(m)).join('');
  scrollToBottom();
}

function appendMessage(msg) {
  const el = document.getElementById('dmMessages');
  const empty = el.querySelector('[style*="لا توجد"]') || el.querySelector('[style*="جاري"]');
  if (empty) empty.remove();
  el.insertAdjacentHTML('beforeend', buildBubble(msg));
}

function buildBubble(m) {
  const mine = m.from === myUsername;
  const time  = new Date(m.timestamp).toLocaleTimeString('ar-DZ', { hour:'2-digit', minute:'2-digit' });
  return `<div class="dm-msg ${mine ? 'mine' : 'theirs'}">
    <div class="dm-bubble">${esc(m.text || '')}</div>
    <div class="dm-msg-time">${time}</div>
  </div>`;
}

// ── Send DM ──
async function sendDM() {
  const input   = document.getElementById('dmInput');
  const text    = input.value.trim();
  if (!text || !activeWith) return;
  input.value = '';
  input.style.height = '';

  const tmpMsg = { from: myUsername, to: activeWith, text, timestamp: new Date().toISOString() };
  appendMessage(tmpMsg);
  scrollToBottom();

  try {
    await apiPost(`/api/dm/${activeWith}`, { text });
    loadConversations();
  } catch(e) { console.error(e); }
}

// ── Typing ──
function onTyping() {
  if (!socket || !activeWith) return;
  socket.emit('dm_typing', { to: activeWith, isTyping: true });
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => { socket.emit('dm_typing', { to: activeWith, isTyping: false }); }, 1500);
}

// ── Helpers ──
function showSidebar() {
  document.getElementById('dmSidebar').classList.add('mobile-show');
}
function scrollToBottom() {
  const el = document.getElementById('dmMessages');
  el.scrollTop = el.scrollHeight;
}
function autoResize(el) {
  el.style.height = '';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function timeAgo(d) {
  if (!d) return '';
  const diff = Math.floor((Date.now() - new Date(d)) / 1000);
  if (diff < 60) return 'الآن';
  if (diff < 3600) return Math.floor(diff/60) + 'د';
  if (diff < 86400) return Math.floor(diff/3600) + 'س';
  return Math.floor(diff/86400) + 'ي';
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function apiGet(path) {
  const res = await fetch(API_BASE + path, { headers: { 'Authorization': 'Bearer ' + myToken } });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, { method:'POST', headers: { 'Authorization':'Bearer '+myToken, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
</script>
</body>
</html>
